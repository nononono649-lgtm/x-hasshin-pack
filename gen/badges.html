<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1000px;height:1000px;overflow:hidden;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;
    background:#F8FAFC;color:#0F172A;padding:60px}
  .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:36px}
  h1{font-size:44px;letter-spacing:.02em}
  .sub{color:#64748B;font-size:22px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
  .cell{background:#fff;border:1px solid #E2E8F0;border-radius:20px;display:flex;align-items:center;justify-content:center;height:190px}
  .cell img{width:78%;height:auto}
  .foot{margin-top:34px;color:#64748B;font-size:20px;text-align:center}
</style>
</head>
<body>
  <div class="head">
    <h1>SNSバッジ素材 12点</h1>
    <div class="sub">SVG・拡大自由・色変更自由</div>
  </div>
  <div class="grid">
    <div class="cell"><img src="../../product/バッジ素材/01_new.svg" alt="NEW"></div>
    <div class="cell"><img src="../../product/バッジ素材/02_pr.svg" alt="PR"></div>
    <div class="cell"><img src="../../product/バッジ素材/03_muryo.svg" alt="無料配布"></div>
    <div class="cell"><img src="../../product/バッジ素材/04_oshirase.svg" alt="お知らせ"></div>
    <div class="cell"><img src="../../product/バッジ素材/05_anketo.svg" alt="アンケート実施中"></div>
    <div class="cell"><img src="../../product/バッジ素材/06_kotei.svg" alt="固定ポスト"></div>
    <div class="cell"><img src="../../product/バッジ素材/07_sale.svg" alt="SALE"></div>
    <div class="cell"><img src="../../product/バッジ素材/08_gentei.svg" alt="限定"></div>
    <div class="cell"><img src="../../product/バッジ素材/09_hajimemashite.svg" alt="はじめまして"></div>
    <div class="cell"><img src="../../product/バッジ素材/10_shigoto.svg" alt="お仕事募集中"></div>
    <div class="cell"><img src="../../product/バッジ素材/11_tsuzuki.svg" alt="続きはこちら"></div>
    <div class="cell"><img src="../../product/バッジ素材/12_honjitsu.svg" alt="本日公開"></div>
  </div>
  <div class="foot">X発信スターターパックに収録</div>
</body>
</html>
