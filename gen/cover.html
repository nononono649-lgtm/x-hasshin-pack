<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1000px;height:1000px;overflow:hidden;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;
    background:radial-gradient(120% 120% at 80% 0%,#1E293B 0%,#0B1220 55%,#090E18 100%);
    color:#fff;display:flex;align-items:center;justify-content:center}
  .frame{width:880px;border:2px solid rgba(255,255,255,.14);border-radius:36px;padding:64px 60px;position:relative}
  .chip{display:inline-block;background:rgba(244,63,94,.16);border:1px solid rgba(244,63,94,.5);color:#FDA4AF;
    border-radius:999px;font-size:24px;font-weight:700;padding:8px 26px;letter-spacing:.06em}
  h1{font-size:64px;line-height:1.25;margin-top:34px;letter-spacing:.02em}
  h1 em{font-style:normal;color:#FDA4AF}
  .items{margin-top:40px;display:grid;gap:18px}
  .item{display:flex;align-items:center;gap:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:18px;padding:20px 26px;font-size:30px;font-weight:600}
  .item b{color:#A5B4FC;font-size:36px;min-width:86px;text-align:right}
  .price{position:absolute;right:-26px;bottom:-30px;background:#F43F5E;color:#fff;font-size:40px;font-weight:800;
    border-radius:24px;padding:14px 34px;box-shadow:0 16px 40px rgba(244,63,94,.45)}
  .price small{font-size:20px;font-weight:600;margin-left:6px}
  .foot{margin-top:44px;color:#94A3B8;font-size:24px;letter-spacing:.04em}
</style>
</head>
<body>
  <div class="frame">
    <span class="chip">ダウンロード商品 / 買い切り</span>
    <h1>X発信<br>スターター<em>パック</em></h1>
    <div class="items">
      <div class="item"><b>50本</b>そのまま使える投稿テンプレート</div>
      <div class="item"><b>20本</b>投稿作成を任せるAIプロンプト</div>
      <div class="item"><b>12点</b>SNSバッジ素材（SVG・加工自由）</div>
      <div class="item"><b>30日</b>習慣化＆収益化ガイド</div>
    </div>
    <div class="foot">発信が続かない、を仕組みで解決する。</div>
    <div class="price">¥100<small>（税込）</small></div>
  </div>
</body>
</html>
