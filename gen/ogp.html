<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;
    background:radial-gradient(120% 140% at 85% 0%,#1E293B 0%,#0B1220 60%,#090E18 100%);color:#fff;
    display:flex;align-items:center}
  .left{padding:0 0 0 80px;width:760px}
  .chip{display:inline-block;background:rgba(244,63,94,.16);border:1px solid rgba(244,63,94,.5);color:#FDA4AF;
    border-radius:999px;font-size:18px;font-weight:700;padding:6px 22px;letter-spacing:.06em}
  h1{font-size:54px;line-height:1.3;margin-top:26px}
  h1 em{font-style:normal;color:#FDA4AF}
  p{color:#CBD5E1;font-size:22px;margin-top:20px;line-height:1.7}
  .right{width:440px;display:grid;gap:16px;padding-right:80px}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;
    padding:18px 26px;font-size:24px;font-weight:700}
  .card b{color:#A5B4FC;font-size:30px;margin-right:14px}
  .price{margin-top:10px;background:#F43F5E;border-radius:18px;padding:16px 26px;font-size:34px;font-weight:800;text-align:center}
</style>
</head>
<body>
  <div class="left">
    <span class="chip">ダウンロード商品 / 買い切り</span>
    <h1>発信が続かない、を<br><em>仕組みで解決。</em></h1>
    <p>コピペで使える投稿テンプレート50本、AIプロンプト20本、SNSバッジ素材12点。</p>
  </div>
  <div class="right">
    <div class="card"><b>50</b>投稿テンプレート</div>
    <div class="card"><b>20</b>AIプロンプト</div>
    <div class="card"><b>12</b>SNSバッジ素材</div>
    <div class="price">¥100</div>
  </div>
</body>
</html>
